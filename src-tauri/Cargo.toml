[package]
name = "lokvyn"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
scraper = "0.29"
serde_json = "1.0.154"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["sync", "time"] }
